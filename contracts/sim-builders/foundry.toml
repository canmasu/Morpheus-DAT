# Matches Morpheus's own compiler settings (hardhat.config.ts in MorpheusAIs/SmartContracts).
[profile.default]
src = "src"
out = "out"
libs = ["node_modules"]
solc_version = "0.8.20"
evm_version = "paris"
optimizer = true
optimizer_runs = 200
remappings = [
    "@openzeppelin/contracts/=node_modules/@openzeppelin/contracts/",
    "@openzeppelin/contracts-upgradeable/=node_modules/@openzeppelin/contracts-upgradeable/",
    "@solarity/solidity-lib/=node_modules/@solarity/solidity-lib/",
]
